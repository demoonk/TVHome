plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.pda.micprobe'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.pda.micprobe'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        debug {
            storeFile file(providers.gradleProperty('tvhomeKeystore').orElse(providers.environmentVariable('TVHOME_KEYSTORE')).getOrElse(System.getProperty('user.home') + '/.android/debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
