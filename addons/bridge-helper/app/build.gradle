plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sumyabazar1.bridgehelper'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.sumyabazar1.bridgehelper'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    signingConfigs {
        // The debug key by path: this build host cannot write the default key under the user profile.
        debug {
            storeFile file(providers.gradleProperty('tvhomeKeystore').orElse(providers.environmentVariable('TVHOME_KEYSTORE')).getOrElse(System.getProperty('user.home') + '/.android/debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the adb framing and the key struct, src/test.
    testImplementation 'junit:junit:4.13.2'
}
