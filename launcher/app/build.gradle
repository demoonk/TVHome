plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('ru.pda.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 68
        versionName '1.4.19'
    }

    signingConfigs {
        // The standard debug key by path: it signs the builds installed on the TVs, and naming it keeps the build
        // from creating its own under the user profile, which this build host cannot write to.
        tv {
            storeFile file(providers.gradleProperty('tvhomeKeystore').orElse(providers.environmentVariable('TVHOME_KEYSTORE')).getOrElse(System.getProperty('user.home') + '/.android/debug.keystore'))
            storePassword providers.environmentVariable('TVHOME_STORE_PASSWORD').getOrElse('android')
            keyAlias providers.environmentVariable('TVHOME_KEY_ALIAS').getOrElse('androiddebugkey')
            keyPassword providers.environmentVariable('TVHOME_KEY_PASSWORD').getOrElse('android')
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.tv
        }
    }

    lint {
        // The lint Vital gate's worker cannot start on this build host (it writes outside the workspace).
        // Lint only checks; assembleRelease's APK does not depend on it. Run lintVitalRelease manually when wanted.
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    buildFeatures {
        // The Projectivy wallpaper-provider contract (src/main/aidl) generates its Java stub at build time.
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
